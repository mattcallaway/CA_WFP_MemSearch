{% extends "base.html" %}
{% block content %}
<section class="section">
    <div class="container">
        <nav class="breadcrumb" aria-label="breadcrumbs">
            <ul>
                <li><a href="{% url 'geography_datasets_list' %}">Geography Datasets</a></li>
                <li class="is-active"><a href="#" aria-current="page">Import Reference File</a></li>
            </ul>
        </nav>

        <div class="columns is-centered">
            <div class="column is-6">
                <div class="card">
                    <header class="card-header">
                        <p class="card-header-title">Upload Geography Reference CSV</p>
                    </header>
                    <div class="card-content">
                        <form action="{% url 'geography_import_upload' %}" method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="field">
                                <label class="label">Select Geography Reference CSV File</label>
                                <div class="file has-name is-fullwidth">
                                    <label class="file-label">
                                        <input class="file-input" type="file" name="file" id="fileInput" accept=".csv" required>
                                        <span class="file-cta">
                                            <span class="file-icon">
                                                <i class="fas fa-upload"></i>
                                            </span>
                                            <span class="file-label">
                                                Choose a file…
                                            </span>
                                        </span>
                                        <span class="file-name" id="fileName">
                                            No file chosen
                                        </span>
                                    </label>
                                </div>
                                <p class="help">File must be a comma-separated values (CSV) format containing California counties, places, ZIPs, or aliases.</p>
                            </div>

                            <div class="field mt-5">
                                <div class="control">
                                    <button type="submit" class="button is-link is-fullwidth">
                                        Upload and Preview Headers
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    if (fileInput) {
        fileInput.onchange = () => {
            if (fileInput.files.length > 0) {
                fileName.textContent = fileInput.files[0].name;
            }
        };
    }
</script>
{% endblock %}
